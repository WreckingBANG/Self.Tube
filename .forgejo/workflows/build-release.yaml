name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:

  build_flatpak-aarch64:
    runs-on: codeberg-aarch64-1
    container: 
      image: docker.io/node:22-bookworm
    steps:

      - name: Prepare Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main
    
      - uses: actions/checkout@v6
        
      - name: Setup Flatpak
        run: |
          nix develop .#ciFlatpak --command bash -ec '
            flatpak --version
            flatpak-builder --version
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install -y flathub org.freedesktop.Sdk//25.08
            flatpak install -y flathub org.freedesktop.Platform//25.08
            flatpak install -y flathub org.freedesktop.Sdk.Extension.llvm20//25.08
          '

      - name: Build Flatpak
        run: |
          nix develop .#ciFlatpak --command bash -ec '
            cd flatpak
            flatpak-builder --disable-rofiles-fuse build-dir com.wreckingbang.selftube.yml --force-clean --repo=repo
            flatpak build-bundle repo selftube.flatpak com.wreckingbang.selftube
            mv selftube.flatpak selftube-linux-aarch64.flatpak
          '
      
      - name: Upload Flatpak
        uses: actions/upload-artifact@v3
        with:
          name: selftube-linux-aarch64
          path: |
            flatpak/selftube-linux-aarch64.flatpak

  build_flatpak-x86_64:
    runs-on: codeberg-x86-1
    container: 
      image: docker.io/node:22-bookworm
    steps:

      - name: Prepare Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main
    
      - uses: actions/checkout@v6
        
      - name: Setup Flatpak
        run: |
          nix develop .#ciFlatpak --command bash -ec '
            flatpak --version
            flatpak-builder --version
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install -y flathub org.freedesktop.Sdk//25.08
            flatpak install -y flathub org.freedesktop.Platform//25.08
            flatpak install -y flathub org.freedesktop.Sdk.Extension.llvm20//25.08
          '
          
      - name: Build Flatpak
        run: |
          nix develop .#ciFlatpak --command bash -ec '
            cd flatpak
            flatpak-builder --disable-rofiles-fuse build-dir com.wreckingbang.selftube.yml --force-clean --repo=repo
            flatpak build-bundle repo selftube.flatpak com.wreckingbang.selftube
            mv selftube.flatpak selftube-linux-x86_64.flatpak
          '
          
      - name: Upload Flatpak
        uses: actions/upload-artifact@v3
        with:
          name: selftube-linux-x86_64
          path: |
            flatpak/selftube-linux-x86_64.flatpak

  build_apk:
    runs-on: codeberg-x86-2
    container: 
      image: docker.io/node:22-bookworm
    steps:

      - name: Prepare Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main
    
      - uses: actions/checkout@v6

      - name: Setup Flutter
        run: |
          nix develop .#ciAndroid --command bash -ec '
            flutter --version
            flutter doctor
          '
          
      - name: Build Flutter
        run: |
          nix develop .#ciAndroid --command bash -ec '
            flutter pub get
            flutter build apk --release --split-per-abi
          '

      - name: Decode signing key
        run: |
          echo "$SIGNING_KEY_B64" | base64 -d > release-keystore.jks
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}

      - name: Sign & rename APKs
        run: |
          nix develop .#ciAndroid --command bash -ec '
            for apk in build/app/outputs/flutter-apk/*.apk; do
              filename=$(basename "$apk")
             
              arch=$(echo "$filename" | sed -E '\''s/app-(.*)-release\.apk/\1/'\'')
            
              out="build/app/outputs/flutter-apk/selftube-android-${arch}.apk"
            
              echo "Signing $apk → $out"
            
              apksigner sign \
                --ks release-keystore.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out "$out" \
                "$apk"
            done
          '
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Sign & rename APKs
        run: |
          nix develop .#ciAndroid --command bash -ec '
            for apk in build/app/outputs/flutter-apk/selftube-android-*.apk; do
              echo "Verifying $apk"
              $BUILD_TOOLS/apksigner verify --verbose "$apk"
            done
          '

      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: selftube-android
          path: build/app/outputs/flutter-apk/selftube-android-*.apk

  
  release:
    needs: 
      - build_apk
      - build_flatpak-x86_64
      - build_flatpak-aarch64
    runs-on: codeberg-x86
    steps:
      - uses: actions/checkout@v6
        
      - uses: actions/download-artifact@v3
        with:
          path: release-assets
          
      - name: Flatten release directory
        run: |
          mkdir flat
          find release-assets -type f -exec mv {} flat/ \;
          rm -rf release-assets
          mv flat release-assets


      - name: publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.2
        with:
          url: "https://codeberg.org"
          repo: "WreckingBANG/Self.Tube"
          direction: upload
          tag: "${{ github.ref_name }}"
          sha: "${{ github.sha }}"
          release-dir: release-assets
          token: ${{ secrets.TOKEN }}
          title: "${{ github.ref_name }}"
          hide-archive-link: true
          release-notes-assistant: true
