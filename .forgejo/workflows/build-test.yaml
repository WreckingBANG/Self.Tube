name: Build Test

on:
  push:

jobs:

  build_test:
    runs-on: codeberg-x86
    container: 
      image: docker.io/node:22-bookworm
    steps:
      - name: Prepare Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main
      
      - uses: actions/checkout@v6
      
      - name: Setup Flutter
        run: |
          nix develop .#ciLinux --command bash -ec '
            flutter --version
            flutter doctor
          '
      
      - name: Build Flutter
        run: |
          nix develop .#ciLinux --command bash -ec '
            flutter pub get
            flutter build linux --debug
          '

