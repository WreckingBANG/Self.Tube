name: Build Debug Artifacts

on:
  workflow_dispatch:

jobs:

  build_apk:
    runs-on: codeberg-x86-2
    container: 
      image: docker.io/node:24-trixie
    steps:
      - name: Prepare Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@main
      
      - uses: actions/checkout@v6
      
      - name: Setup Flutter
        run: |
          nix develop .#ciAndroid --command bash -ec '
            flutter --version
            flutter doctor
          '

      - name: Build Flutter
        run: |
          nix develop .#ciAndroid --command bash -ec '
            flutter pub get
            sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
            flutter build apk --debug 
          '
          
      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: selftube-android-universal
          path: |
            build/app/outputs/flutter-apk/*.apk
